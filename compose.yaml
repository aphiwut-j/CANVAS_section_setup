services:
  web:
    build: .
    environment:
      CANVAS_BASE_URL: ${CANVAS_BASE_URL:-}
      CANVAS_API_TOKEN: ${CANVAS_API_TOKEN:-}
      CANVAS_DEMO_MODE: ${CANVAS_DEMO_MODE:-false}
      SECRET_KEY: ${SECRET_KEY:-local-container-key-change-me}
      APP_HOST: 0.0.0.0
      APP_PORT: 8010
    ports:
      - "8010:8010"
    volumes:
      - ./.agent:/workspace/.agent

